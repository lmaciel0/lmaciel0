name: Métricas do perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gerar_metricas.py
      - .github/workflows/metricas.yml

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gera os cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar_metricas.py "${{ github.repository_owner }}" saida

      # O branch "metricas" guarda só a versão mais recente das imagens,
      # para não encher o histórico do main com commits automáticos.
      - name: Publica no branch metricas
        working-directory: saida
        run: |
          git init -q -b metricas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Atualiza métricas do perfil"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" metricas
